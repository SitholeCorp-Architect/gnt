openapi: 3.1.0
info:
  title: AI GNT API
  version: 0.1.0
paths:
  /v1/brain/summary:
    get:
      tags:
      - brain
      summary: Brain Summary
      operationId: brain_summary_v1_brain_summary_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - HTTPBearer: []
  /v1/onboarding/status:
    get:
      tags:
      - brain
      summary: Onboarding Status
      description: 'This org''s onboarding progress — "how close is this org to a
        working

        setup" — aggregated off onboarding_events (gnt/onboarding_metrics.py).

        Planned future ROI metering will read off the same table, so counts

        stay a flat event_type -> count map here rather than baking in today''s

        five known types.


        connected_cli isn''t an onboarding_event (gnt login has no event-log

        call site, unlike the Slack/GitHub connect routes and rule proposal) —

        it''s read straight off mcp_api_keys instead. A CLI key, once minted,

        always stays a row here even if later revoked, so this answers "has

        this org ever completed gnt login", not "is a CLI key live right now".

        apps/web/components/onboarding-status.tsx polls this for the /welcome

        page''s live step checklist.


        reached_five_rules_milestone is this product''s "org reaches N approved

        rules in first session" success metric, N=5 — derived straight off

        the same counts, not a second query,

        since rules_approved already is that lifetime-cumulative count (see

        onboarding_metrics.RULES_APPROVED_MILESTONE for why that''s an

        accurate proxy for "first session" here).'
      operationId: onboarding_status_v1_onboarding_status_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - HTTPBearer: []
  /v1/skill-packs/latest.zip:
    get:
      tags:
      - skill-packs
      summary: Latest Skill Pack
      operationId: latest_skill_pack_v1_skill_packs_latest_zip_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - HTTPBearer: []
  /v1/whoami:
    get:
      tags:
      - settings
      summary: Whoami
      description: 'Lets apps/web''s CLI-facing org routes (app/api/cli/org/*) verify
        a

        cli-key and learn which org it''s admin-scoped to, without duplicating

        key-hash/expiry/revocation logic over there — that''s already exactly

        what require_admin resolves. No user_id in the response: a cli-key

        carries no real Better Auth identity of its own (see

        OrgContext.user_id''s own comment), so apps/web resolves an acting

        admin from the org''s own member list instead.'
      operationId: whoami_v1_whoami_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - HTTPBearer: []
  /v1/settings/cli-key:
    post:
      tags:
      - settings
      summary: Create Cli Key
      description: 'Mints a personal credential for gnt login — deliberately separate

        from create_mcp_key below. This is the ONLY path that ever sets

        is_admin=True on a key, and require_session (wrapped inside

        enforce_cli_key_rate_limit) means it can only be called with a live

        session, never an existing API key, closing the self-escalation path

        (an API key minting another, more capable, API key). The rate limit

        on top of that is a separate backstop: a live session, compromised or

        scripted, shouldn''t be able to mint unlimited admin-snapshotting keys.

        The key this returns still isn''t meant to be handed to an agent — it

        carries the minting human''s own admin status. Also stamps a default

        expires_at (cli_key_default_ttl_days, 90 days) — a live human logs

        back in well within that window, so this bounds

        how long a laptop-left-somewhere credential stays valid without

        anyone needing to remember to revoke it by hand.'
      operationId: create_cli_key_v1_settings_cli_key_post
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/CreateKeyRequest'
              - type: 'null'
              title: Body
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /v1/settings/cli-key/poll:
    get:
      tags:
      - settings
      summary: Poll Cli Key
      description: 'Deliberately unauthenticated -- the CLI has no session or key
        yet at

        this point, that''s the entire reason this endpoint exists. Security

        here rests on login_id''s own unguessability (a random UUID minted

        fresh per `gnt login` run, ~120 bits of entropy) plus one-time

        consumption and a short TTL, same trust model RFC 8628''s device

        authorization grant relies on -- and no weaker than what this replaced

        (a random ephemeral port on localhost was the previous flow''s only

        protection). That flow POSTed the key straight to a plain HTTP server

        gnt login ran on 127.0.0.1: Chrome''s Local Network Access policy now

        requires an explicit permission grant before a public https page can

        even reach a loopback address, which broke that delivery outright and

        isn''t something a response header can opt back into. Polling this

        instead sidesteps browser loopback access entirely.'
      operationId: poll_cli_key_v1_settings_cli_key_poll_get
      parameters:
      - name: login_id
        in: query
        required: true
        schema:
          type: string
          title: Login Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/settings/mcp-keys:
    get:
      tags:
      - settings
      summary: List Mcp Keys
      operationId: list_mcp_keys_v1_settings_mcp_keys_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - HTTPBearer: []
    post:
      tags:
      - settings
      summary: Create Mcp Key
      description: 'No default expires_at, unlike create_cli_key above — that default

        TTL is scoped specifically to CLI keys. An

        MCP key is handed to an agent and left running unattended for however

        long that integration is meant to live; there''s no human login cadence

        to bound it against the way a CLI key has one, and a silent expiry

        would just be a surprise outage for whatever''s calling the MCP server.

        Revocation (already shipped) is the intended way to kill one of these

        early; expires_at just stays null here.'
      operationId: create_mcp_key_v1_settings_mcp_keys_post
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/CreateKeyRequest'
              - type: 'null'
              title: Body
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /v1/settings/mcp-keys/{key_id}/revoke:
    post:
      tags:
      - settings
      summary: Revoke Mcp Key
      operationId: revoke_mcp_key_v1_settings_mcp_keys__key_id__revoke_post
      security:
      - HTTPBearer: []
      parameters:
      - name: key_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Key Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/settings/mcp-keys/{key_id}/rotate:
    post:
      tags:
      - settings
      summary: Rotate Mcp Key
      description: 'Mirrors rotate_cli_key, scoped to key_type == "mcp". Rate limited

        the same as create_mcp_key (rotation mints a new row, same abuse

        surface as minting outright) -- picked up in a rebase onto main after

        a sibling change added that limit after this branch had already

        forked from it; wired in here to close the gap rather than ship this

        PR without it. enforce_mcp_key_

        rate_limit wraps get_current_org, still the right AUTH gate on its

        own (not require_session, matching create_mcp_key and revoke_mcp_key

        above): an MCP key is never admin-capable regardless of who mints or

        rotates it, so there''s no self-escalation path to close the way

        rotate_cli_key has to close one. No default expires_at on the

        replacement either, for the same reason create_mcp_key leaves it

        null.'
      operationId: rotate_mcp_key_v1_settings_mcp_keys__key_id__rotate_post
      security:
      - HTTPBearer: []
      parameters:
      - name: key_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Key Id
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/settings/cli-keys:
    get:
      tags:
      - settings
      summary: List Cli Keys
      description: 'Mirrors list_mcp_keys, scoped to key_type == "cli" — lets an org
        see

        every personal CLI login credential minted under it (org.org_id filter

        is the only tenant boundary here: mcp_api_keys has no RLS policy of

        its own, see migration 0007''s docstring, since resolving a bearer

        token to an org has to happen before the org is known).'
      operationId: list_cli_keys_v1_settings_cli_keys_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - HTTPBearer: []
  /v1/settings/cli-keys/{key_id}/revoke:
    post:
      tags:
      - settings
      summary: Revoke Cli Key
      description: 'Mirrors revoke_mcp_key exactly, scoped to key_type == "cli". Used
        by

        the settings UI/founder tooling to kill a specific CLI credential, and

        by `gnt logout` (with the key''s own id, handed back at mint time and

        saved locally) to revoke itself server-side on the way out. Deliberately

        get_current_org, not require_session: revoking an existing key never

        mints anything new, so there''s no self-escalation path to close the

        way create_cli_key has to close one — and `gnt logout` only ever has

        the plaintext key itself to authenticate with, never a live session.'
      operationId: revoke_cli_key_v1_settings_cli_keys__key_id__revoke_post
      security:
      - HTTPBearer: []
      parameters:
      - name: key_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Key Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/settings/cli-keys/{key_id}/rotate:
    post:
      tags:
      - settings
      summary: Rotate Cli Key
      description: 'Mints a replacement CLI key, THEN revokes the

        one being rotated — in that order, so a failure between the two steps

        (e.g. the commit below never lands) leaves the caller with two valid

        keys rather than revoke-then-fail-to-create, which would lock them

        out. The new key inherits the old row''s name/is_admin, and gets a

        fresh 90-day expires_at exactly like a brand new create_cli_key call.


        Gated the same way create_cli_key is (enforce_cli_key_rate_limit,

        which wraps require_session), not get_current_org like revoke_cli_key

        above — rotation mints a NEW key carrying the OLD row''s is_admin

        snapshot, so this is a mint, not a revoke, and has the same

        self-escalation path require_session exists to close: an API key

        (even a non-admin one) must not be able to rotate an admin-capable

        CLI key in the same org into a plaintext it could then read.'
      operationId: rotate_cli_key_v1_settings_cli_keys__key_id__rotate_post
      security:
      - HTTPBearer: []
      parameters:
      - name: key_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Key Id
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/settings/webhook-tokens:
    get:
      tags:
      - settings
      summary: List Webhook Tokens
      operationId: list_webhook_tokens_v1_settings_webhook_tokens_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
      security:
      - HTTPBearer: []
    post:
      tags:
      - settings
      summary: Create Webhook Token
      description: 'Mints the credential a Zapier/monday/HubSpot

        webhook config posts to routers/webhooks.py''s ingest endpoint with.

        require_admin (not require_session like create_cli_key): this token

        can only ever create draft rules, nothing McpApiKey-authenticated

        callers can''t already do, so there''s no privilege-escalation path to

        close the way an admin-snapshotting CLI key mint has to close one —

        an existing API key with admin standing is fine minting one of these.'
      operationId: create_webhook_token_v1_settings_webhook_tokens_post
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/CreateKeyRequest'
              - type: 'null'
              title: Body
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /v1/settings/webhook-tokens/{token_id}/revoke:
    post:
      tags:
      - settings
      summary: Revoke Webhook Token
      operationId: revoke_webhook_token_v1_settings_webhook_tokens__token_id__revoke_post
      security:
      - HTTPBearer: []
      parameters:
      - name: token_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Token Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/rules:
    post:
      tags:
      - rules
      summary: Create Rule
      operationId: create_rule_v1_rules_post
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRuleRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - rules
      summary: List Rules
      operationId: list_rules_v1_rules_get
      security:
      - HTTPBearer: []
      parameters:
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/rules/staleness/due:
    get:
      tags:
      - rules
      summary: Get Rules Due For Revalidation
      description: 'Approved rules this org''s last nightly compute_rule_staleness
        run

        flagged as past the staleness threshold — due for a human to confirm

        still true, or open a deprecation/refresh PR. Backs `gnt stale`.


        A stopgap, not the final home for this: the eventual plan is to

        surface this prompt in a weekly digest email, which doesn''t exist

        yet — it''s waiting on that digest itself and on the nightly

        contradiction-sweep worker (workers/tasks_contradictions.py), which

        also needs to land first. This list is the same underlying signal,

        surfaced as CLI visibility instead — wire it into the digest once

        that email exists rather than building a second parallel version of

        it.


        Registered before /{rule_id} in this file, but doesn''t actually need

        to be — "staleness"/"due" are two path segments, "{rule_id}" matches

        exactly one, so there''s no route collision to order around.'
      operationId: get_rules_due_for_revalidation_v1_rules_staleness_due_get
      security:
      - HTTPBearer: []
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 50
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/rules/{rule_id}:
    get:
      tags:
      - rules
      summary: Get Rule
      operationId: get_rule_v1_rules__rule_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: rule_id
        in: path
        required: true
        schema:
          type: string
          title: Rule Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/rules/{rule_id}/submit:
    post:
      tags:
      - rules
      summary: Submit Rule
      operationId: submit_rule_v1_rules__rule_id__submit_post
      security:
      - HTTPBearer: []
      parameters:
      - name: rule_id
        in: path
        required: true
        schema:
          type: string
          title: Rule Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/rules/{rule_id}/propose:
    post:
      tags:
      - rules
      summary: Propose Rule
      description: 'Renders the rule to markdown and opens a PR against the org''s

        connected repo. This is `approve`''s replacement — approval now means a

        human merging that PR on GitHub, not an in-terminal keypress (see

        docs/migration/RECONCILE_V2.md). The actual approved-status transition,

        including the HMAC-signed write and the previous-version supersede

        dance approve_rule used to do here, happens in the webhook handler

        once a real merge is confirmed — this endpoint only ever writes

        `pending_merge`, never `approved`, so none of that machinery belongs

        in this function anymore.'
      operationId: propose_rule_v1_rules__rule_id__propose_post
      security:
      - HTTPBearer: []
      parameters:
      - name: rule_id
        in: path
        required: true
        schema:
          type: string
          title: Rule Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/rules/batch-propose:
    post:
      tags:
      - rules
      summary: Batch Propose Rules
      description: 'propose_rule''s batched sibling — one branch, one

        put_file per rule, ONE pull request for the whole batch, and every

        rule in it moves to pending_merge together carrying the SAME

        prNumber/prUrl. Built for `gnt prebrain`''s draft-rule output (5-8

        related rules reviewed as one PR), but not restricted to that caller.


        Validation fails the WHOLE batch with a clear error naming the

        offending rule(s) rather than silently skipping or partially

        processing — a batch is one reviewable unit; a caller that asked for

        5 rules and silently got 3 proposed has no way to know that happened

        short of diffing IDs itself. Nothing GitHub-side happens until every

        rule in the batch has already passed validation.'
      operationId: batch_propose_rules_v1_rules_batch_propose_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchProposeRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /v1/rules/{rule_id}/reject:
    post:
      tags:
      - rules
      summary: Reject Rule
      operationId: reject_rule_v1_rules__rule_id__reject_post
      security:
      - HTTPBearer: []
      parameters:
      - name: rule_id
        in: path
        required: true
        schema:
          type: string
          title: Rule Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectRuleRequest'
      responses:
