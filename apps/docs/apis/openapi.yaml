          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/rules/{rule_id}/deprecate:
    post:
      tags:
      - rules
      summary: Deprecate Rule
      operationId: deprecate_rule_v1_rules__rule_id__deprecate_post
      security:
      - HTTPBearer: []
      parameters:
      - name: rule_id
        in: path
        required: true
        schema:
          type: string
          title: Rule Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/rules/{rule_id}/edit:
    post:
      tags:
      - rules
      summary: Edit Rule
      description: 'Creates a new draft version of an approved rule. The old rule
        stays

        exactly as-is (still approved, still served) until the new version

        is itself approved — see approve_rule''s supersede step.'
      operationId: edit_rule_v1_rules__rule_id__edit_post
      security:
      - HTTPBearer: []
      parameters:
      - name: rule_id
        in: path
        required: true
        schema:
          type: string
          title: Rule Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRuleRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/transcribe:
    post:
      tags:
      - transcribe
      summary: Transcribe
      operationId: transcribe_v1_transcribe_post
      requestBody:
        content:
          multipart/form-data:
