          type: string
          title: Agent Email
        api_token:
          type: string
          format: password
          title: Api Token
          writeOnly: true
      type: object
      required:
      - subdomain
      - agent_email
      - api_token
      title: ConnectZendeskRequest
    CreateKeyRequest:
      properties:
        name:
