components:
  schemas:
    BatchProposeRequest:
      properties:
        rule_ids:
          items:
            type: string
          type: array
          minItems: 1
          title: Rule Ids
      type: object
      required:
      - rule_ids
      title: BatchProposeRequest
      description: 'Batches several already-in_review rules into ONE

        PR instead of propose_rule''s one-PR-per-rule. A deliberate design

        choice (not "fake" batching via pacing individual propose_rule calls): the

        customer reviews 5-8 related rules as a single PR, not 5-8 separate

        ones.'
    BillingStatus:
      properties:
        entitled:
          type: boolean
          title: Entitled
        subscription_status:
          anyOf:
          - type: string
          - type: 'null'
          title: Subscription Status
        trial_ends_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Trial Ends At
        plan_tier:
          type: string
          title: Plan Tier
        monthly_actions_used:
          type: integer
          title: Monthly Actions Used
        monthly_actions_cap:
          type: integer
          title: Monthly Actions Cap
        cancel_at_period_end:
          type: boolean
          title: Cancel At Period End
        current_period_end:
          anyOf:
          - type: string
          - type: 'null'
          title: Current Period End
      type: object
      required:
      - entitled
      - subscription_status
      - trial_ends_at
      - plan_tier
      - monthly_actions_used
      - monthly_actions_cap
      - cancel_at_period_end
      - current_period_end
      title: BillingStatus
    Body_transcribe_v1_transcribe_post:
      properties:
