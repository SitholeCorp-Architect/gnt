          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/slack/oauth/callback:
    get:
      tags:
      - slack
      summary: Oauth Callback
      operationId: oauth_callback_v1_slack_oauth_callback_get
      parameters:
      - name: code
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Code
