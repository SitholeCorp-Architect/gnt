name: Bootstrap baseline release (one-off, remove after running)

# Single-use: creates cli-v0.6.0, the historical baseline marking where
# public release tracking starts, at the actual squash-cutover commit --
# not something batch-release.yml's own recurring weekly logic can do,
# since there's no prior tag to diff from and the notes here are hand-
# written, not auto-generated. Delete this file once it's been run once.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTES=$(cat <<'NOTES_EOF'
          This is where public release tracking starts — `gnt-ai/gnt`'s history begins with a single squashed commit from the Apache-2.0 relicense/public cut, so there's no real incremental history to generate notes from for this one.

          `@gnt-ai/cli` was already at 0.6.0 on npm before this repo went public. Versions 0.1.0 through 0.5.7 predate the public repo entirely — see `npm view @gnt-ai/cli versions` for the raw version list if you want it, but there's no changelog for them beyond that.

          From here on, every real `@gnt-ai/cli` version bump is auto-tagged and auto-noted the moment it publishes to npm, and any public-repo-only activity in between gets a weekly batch release (see batch-release.yml).
          NOTES_EOF
          )
          NOTES=$(echo "$NOTES" | sed 's/^          //')
          gh release create "cli-v0.6.0" \
            --repo "${{ github.repository }}" \
            --target "dc8551574bd52978716828dd1fbd1653c573ba7b" \
            --title "cli-v0.6.0" \
            --notes "$NOTES"
